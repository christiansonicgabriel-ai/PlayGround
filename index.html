<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blue Blur Dash</title>
<style>
:html,body{height:100%;margin:0}body{overflow:hidden;background:#071e46;font-family:Arial Black,Impact,sans-serif;color:white;touch-action:none;user-select:none}.game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#43c4ff 0 58%,#187dce 58%)}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none;text-shadow:3px 3px 0 #123b89}.top{position:absolute;left:24px;right:24px;top:18px;display:flex;justify-content:space-between;font-size:24px}.rings{color:#ffe934}.score{text-align:center}.pause{pointer-events:auto;position:absolute;right:22px;top:65px;width:50px;height:50px;border:3px solid white;border-radius:50%;background:#1b55b5;color:white;font-size:22px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,29,82,.55);pointer-events:auto}.card{text-align:center;padding:30px 38px;border:4px solid white;border-radius:22px;background:linear-gradient(160deg,#1177dd,#12327d);box-shadow:0 10px 0 #061b50}.card h1{font-size:48px;margin:0 0 8px;color:#ffe934;-webkit-text-stroke:2px #fff}.card p{margin:8px}.btn{margin-top:14px;border:3px solid white;border-radius:12px;padding:12px 28px;background:#ffcc00;color:#17306f;font-size:20px;font-family:inherit;cursor:pointer;box-shadow:0 6px 0 #be6210}.hidden{display:none}.touch{position:absolute;bottom:22px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}.touch button{pointer-events:auto;width:72px;height:72px;border:3px solid white;border-radius:50%;background:rgba(10,67,145,.72);color:white;font-size:34px}.touch button:last-child{background:rgba(226,50,78,.78)}@media(max-width:700px){.top{left:12px;right:12px;font-size:17px}.pause{width:42px;height:42px;right:12px}.touch button{width:62px;height:62px}.card h1{font-size:36px}}</style>
</head>
<body>
<div class="game"><canvas id="c"></canvas><div class="hud"><div class="top"><div><div class="rings">◉ <span id="rings">000</span></div><div>SPEED <span id="speed">1</span></div></div><div class="score"><div id="score">000000</div><div>TIME <span id="time">0:00</span></div></div></div><button id="pause" class="pause">Ⅱ</button></div><div id="touch" class="touch"><button id="left">◀</button><button id="right">▶</button><button id="jump">↑</button></div><div id="overlay" class="overlay"><div class="card"><h1 id="title">BLUE BLUR</h1><p id="subtitle">Run. Jump. Spin. Don't crash!</p><button id="start" class="btn">START</button></div></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,dpr;function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
let state='menu',lane=1,targetLane=1,speed=16,distance=0,rings=0,score=0,startTime=0,paused=false,inv=0,spin=0;const yBase=()=>H*.78;let playerY=0,vy=0,jump=false;
let objects=[],ringsList=[],clouds=[];for(let i=0;i<14;i++)clouds.push({x:Math.random()*W*2,y:40+Math.random()*H*.38,s:.5+Math.random()});
function reset(){lane=1;targetLane=1;speed=16;distance=0;rings=0;score=0;objects=[];ringsList=[];playerY=0;vy=0;jump=false;inv=0;spin=0;startTime=performance.now();for(let i=0;i<16;i++)spawnRow(i*170+700)}
function spawnRow(z){let t=Math.random();if(t>.42){let l=Math.floor(Math.random()*3),kind=Math.random()<.45?'barrier':'bot';objects.push({z,l,kind})}for(let i=0;i<3;i++)if(Math.random()<.48)ringsList.push({z:z+i*38,l:Math.floor(Math.random()*3),got:false})}
function laneX(l,z=0){return W*.5+(l-1)*Math.min(W*.16,150)*(1-.18*Math.min(z/1200,.7))}
function proj(z){let depth=Math.max(0,1-z/1500);return {x:W*.5+(laneX(lane,0)-W*.5)*(1-depth),y:H*.39+(yBase()-H*.39)*depth,scale:.12+depth*.95}}
function drawBackground(t){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#39bdf7');sky.addColorStop(.58,'#98e7ff');sky.addColorStop(.581,'#32a82d');sky.addColorStop(.62,'#1c8422');sky.addColorStop(.621,'#edc66b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let c of clouds){let x=(c.x-t*.012*c.s)%(W+300)-150;ctx.fillStyle='rgba(255,255,255,.82)';ctx.beginPath();ctx.arc(x,c.y,28*c.s,0,7);ctx.arc(x+32*c.s,c.y-12*c.s,38*c.s,0,7);ctx.arc(x+68*c.s,c.y,29*c.s,0,7);ctx.fill()}ctx.fillStyle='#158f32';ctx.beginPath();ctx.moveTo(0,H*.62);for(let i=0;i<=12;i++)ctx.lineTo(i*W/12,H*.52-Math.sin(i*1.7)*H*.07);ctx.lineTo(W,H*.62);ctx.fill();ctx.strokeStyle='#87c94f';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(0,H*.62);ctx.lineTo(W,H*.62);ctx.stroke();let horizon=W*.5;ctx.fillStyle='#bf9b55';ctx.beginPath();ctx.moveTo(horizon,H*.62);ctx.lineTo(W*.12,H);ctx.lineTo(W*.88,H);ctx.closePath();ctx.fill();for(let i=0;i<9;i++){let z=i*170-(distance%170);if(z<30)continue;let p=Math.max(0,1-z/1500),yp=H*.62+(H-H*.62)*p,hw=H*.16*p+8;ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=Math.max(1,p*5);ctx.beginPath();ctx.moveTo(horizon-(hw*1.7),yp);ctx.lineTo(horizon+(hw*1.7),yp);ctx.stroke()}ctx.fillStyle='#d83355';ctx.fillRect(0,H*.61,W,4)}
function drawRing(r){let z=r.z-distance;if(z<10||z>1500)return;let p=Math.max(0,1-z/1500),y=H*.62+(yBase()-H*.62)*p-75*p,scale=.15+p*.9,x=laneX(r.l,z)+(W*.5-laneX(r.l,z))*(.1+p*.9);ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#fff4a2';ctx.beginPath();ctx.ellipse(0,0,23,32,0,0,7);ctx.fill();ctx.fillStyle='#ffa900';ctx.beginPath();ctx.ellipse(0,0,15,24,0,0,7);ctx.fill();ctx.fillStyle='#f4c400';ctx.beginPath();ctx.ellipse(0,0,8,18,0,0,7);ctx.fill();ctx.restore()}
function drawObject(o){let z=o.z-distance;if(z<10||z>1500)return;let p=Math.max(0,1-z/1500),scale=.12+p*.95,x=laneX(o.l,z)+(W*.5-laneX(o.l,z)*0)*(0);x=W*.5+(laneX(o.l,z)-W*.5)*p;let y=H*.62+(yBase()-H*.62)*p;ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(o.kind==='barrier'){ctx.fillStyle='#d63838';ctx.fillRect(-45,-55,90,55);ctx.fillStyle='#f5efdf';for(let i=-35;i<36;i+=24){ctx.save();ctx.translate(i,-27);ctx.rotate(.7);ctx.fillRect(-5,-22,10,44);ctx.restore()}ctx.fillStyle='#6d2f20';ctx.fillRect(-50,-5,100,8)}else{ctx.fillStyle='#9d1e31';ctx.beginPath();ctx.roundRect(-42,-72,84,72,10);ctx.fill();ctx.fillStyle='#f0d5b1';ctx.fillRect(-26,-58,52,25);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-15,-45,6,0,7);ctx.arc(15,-45,6,0,7);ctx.fill();ctx.fillStyle='#eee';ctx.fillRect(-34,-10,68,10)}ctx.restore()}
function drawHero(t){let x=W*.5+(laneX(targetLane,0)-W*.5)*.55,y=yBase()+playerY;ctx.save();ctx.translate(x,y);if(spin>0){ctx.rotate(t*.025)}ctx.scale(Math.max(.8,W/900),Math.max(.8,W/900));ctx.fillStyle='#123c9d';ctx.beginPath();ctx.ellipse(0,-45,28,42,.1,0,7);ctx.fill();ctx.fillStyle='#1768ed';ctx.beginPath();ctx.ellipse(0,-48,25,38,.1,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-83,24,0,7);ctx.fill();ctx.fillStyle='#efe4c9';ctx.beginPath();ctx.ellipse(-7,-82,12,17,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-18,-98);ctx.lineTo(-36,-110);ctx.lineTo(-21,-82);ctx.closePath();ctx.fill();ctx.fillStyle='#f1d9ac';ctx.beginPath();ctx.arc(-3,-86,13,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-91,6,7,7);ctx.arc(-8,-91,3,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-7,-91,2.5,0,7);ctx.fill();ctx.fillStyle='#ef3434';ctx.fillRect(-27,-71,54,14);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-30,-58);ctx.lineTo(-14,-65);ctx.lineTo(-5,-58);ctx.lineTo(-15,-48);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(30,-58);ctx.lineTo(14,-65);ctx.lineTo(5,-58);ctx.lineTo(15,-48);ctx.closePath();ctx.fill();ctx.fillStyle='#edb93d';ctx.fillRect(-22,-10,44,8);ctx.fillStyle='#ed3030';ctx.fillRect(-32,-12,20,17);ctx.fillRect(12,-12,20,17);ctx.fillStyle='#123c9d';ctx.fillRect(-12,-22,24,14);ctx.restore()}
function update(dt,t){if(state!=='playing'||paused)return;distance+=speed*dt*5.5;speed=Math.min(32,16+distance/5000);score+=dt*speed*12;if(vy||playerY<0){vy-=1500*dt;playerY+=vy*dt;if(playerY>0){vy=0;playerY=0;jump=false}}lane+=(targetLane-lane)*Math.min(1,dt*10);inv=Math.max(0,inv-dt);spin=Math.max(0,spin-dt);if(objects.length&&objects[objects.length-1].z-distance<1000)spawnRow(objects[objects.length-1].z+170);objects=objects.filter(o=>o.z-distance>-120);ringsList=ringsList.filter(r=>r.z-distance>-120);for(let r of ringsList){if(!r.got&&r.z-distance<35&&r.z-distance>-25&&r.l===lane){r.got=true;rings++}}for(let o of objects){let z=o.z-distance;if(z<30&&z>-25&&o.l===lane&&inv<=0){if(o.kind==='barrier'&&!jump){hit()}else if(o.kind==='bot'){hit()}}}document.getElementById('rings').textContent=String(rings).padStart(3,'0');document.getElementById('score').textContent=String(Math.floor(score)).padStart(6,'0');document.getElementById('speed').textContent=(speed/16).toFixed(1);document.getElementById('time').textContent=formatTime((t-startTime)/1000)}
function hit(){inv=1.8;if(rings>0){rings=Math.max(0,rings-5)}else{state='over';showOverlay('RUN OVER',`Score ${Math.floor(score)} • Rings ${rings}`,'TRY AGAIN')}}
function formatTime(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')}
function jumpNow(){if(state==='playing'&&!paused&&playerY>=-1&&!jump){jump=true;vy=560;spin=.7}}
function showOverlay(title,sub,btn){document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=sub;document.getElementById('start').textContent=btn;document.getElementById('overlay').classList.remove('hidden')}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;drawBackground(t);update(dt,t);objects.sort((a,b)=>b.z-a.z);for(let o of objects)drawObject(o);for(let r of ringsList)if(!r.got)drawRing(r);drawHero(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').onclick=()=>{reset();state='playing';paused=false;document.getElementById('overlay').classList.add('hidden')};document.getElementById('pause').onclick=()=>{if(state==='playing'){paused=!paused;paused?showOverlay('PAUSED','Take a breath','RESUME'):document.getElementById('overlay').classList.add('hidden')}};document.getElementById('overlay').onclick=e=>{if(e.target===e.currentTarget&&paused){paused=false;document.getElementById('overlay').classList.add('hidden')}};
function move(d){if(state==='playing')targetLane=Math.max(0,Math.min(2,targetLane+d))}document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('jump').onclick=jumpNow;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' '||e.key==='w')jumpNow();if(e.key==='Escape')document.getElementById('pause').click()});
let tx=0;cv.addEventListener('pointerdown',e=>tx=e.clientX);cv.addEventListener('pointerup',e=>{let dx=e.clientX-tx;if(Math.abs(dx)>35)move(dx<0?-1:1);else jumpNow()});
</script>
</body></html>
